<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick a strategy template</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#00ff9c}a:hover{color:#00ffc8}
</style>
</helmet>
<div style="width: 390px; height: 1180px; box-sizing: border-box; background: #261d45; color: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Ubuntu, sans-serif; display: flex; flex-direction: column;">

  <div style="display: flex; justify-content: space-between; align-items: center; height: 44px; padding: 0 16px; background: #100d23; border-bottom: 1px solid #1d1833; font-family: 'Fira Code', Consolas, monospace; font-size: 12px; color: #7877b3;">
    <div>STL // NEW STRATEGY</div>
    <div>1 / 5</div>
  </div>

  <div style="padding: 24px 16px 0 16px; display: flex; flex-direction: column; gap: 8px;">
    <div style="font-family: 'Fira Code', Consolas, monospace; font-size: 12px; color: #b08bff;">Welcome to Strategy Trading Lab</div>
    <h1 style="margin: 0; font-family: 'Fira Code', Consolas, monospace; font-size: 28px; line-height: 36px; font-weight: 600; color: #00ff9c;">Pick a strategy template</h1>
    <p style="margin: 0; font-size: 14px; line-height: 22px;">Each template is a few simple rules with tested defaults. See how it did in the past, tune it, then run it as a simulation or live.</p>
  </div>

  <div style="padding: 20px 16px 0 16px; display: flex; flex-direction: column; gap: 8px;">
    <sc-for list="{{ templates }}" as="t" hint-placeholder-count="5">
      <button onClick="{{ t.pick }}" style="text-align: left; font-family: inherit; color: #ffffff; cursor: pointer; background: #372963; border: 1px solid {{ t.border }}; box-shadow: {{ t.glow }}; border-radius: 0; padding: 16px; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: flex-start; gap: 8px; width: 100%;">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
            
            <div style="font-family: 'Fira Code', Consolas, monospace; font-size: 18px; line-height: 26px; font-weight: 600;">{{ t.name }}</div><div style="font-family: 'Fira Code', Consolas, monospace; font-size: 12px; line-height: 20px; color: #76c1ff;">"{{ t.tagline }}"</div>
          </div>
          <sc-if value="{{ t.on }}" hint-placeholder-val="{{ false }}">
            <div style="width: 22px; height: 22px; border-radius: 2px; background: #00ff9c; flex: none; display: flex; align-items: center; justify-content: center;">
              <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5l2.6 2.5L10 3.5" fill="none" stroke="#00140b" stroke-width="2" stroke-linecap="square"></path></svg>
            </div>
          </sc-if>
          <sc-if value="{{ t.off }}" hint-placeholder-val="{{ true }}">
            <div style="width: 22px; height: 22px; border-radius: 2px; border: 1px solid #7877b3; box-sizing: border-box; flex: none;"></div>
          </sc-if>
        </div>
        <div style="font-size: 13px; line-height: 20px;">{{ t.idea }}</div>
        <span style="font-size: 13px; line-height: 20px; color: #00ff9c; text-decoration: underline;">Learn more</span>
      </button>
    </sc-for>
  </div>

  <div style="margin-top: auto; padding: 16px; background: #100d23; border-top: 1px solid #1d1833; display: flex; flex-direction: column; gap: 8px;">
    <a href="{{ reviewHref }}" style="height: 48px; border-radius: 2px; background: #00ff9da6; color: #00140b; font-size: 13px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; text-decoration: none; display: flex; align-items: center; justify-content: center;">Continue</a>
    <div style="text-align: center; font-size: 12px; line-height: 16px; color: #7877b3;">Pick one to start. You can add more strategies later, from any template.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'dip' };
  }
  renderVals() {
    const base = [
      { id: 'dip', name: 'Dip in winners', tagline: 'Find the next Nvidia',
        idea: 'A stock on a strong run takes a small step back. The strategy signals that dip.' },
      { id: 'comeback', name: 'The comeback', tagline: 'Stocks on the rise',
        idea: 'A stock that fell a lot starts to recover. The strategy looks for a confirmed turnaround.' },
      { id: 'drop', name: 'The big market drop', tagline: 'When the market is on sale',
        idea: 'When the whole market falls 20%, the strategy signals buys of a broad S&P 500 fund in small steps as it recovers.' },
      { id: 'trend', name: 'Ride the long trend', tagline: 'Take the wins, dodge the losses',
        idea: 'The strategy signals a buy of a broad index fund when the market moves into an uptrend, and a sale when the trend turns down.' },
      { id: 'ai', name: 'Your AI\'s top picks', tagline: 'Let your AI do the reading',
        idea: 'Every 2 weeks the AI scores each stock from 0 to 100, and the top score should get a position. Use your own AI.' }
    ];
    const picked = this.state.picked;
    const templates = base.map((t) => {
      const on = picked === t.id;
      return { ...t, on, off: !on,
        border: on ? '#00ff9c' : '#1d1833',
        glow: on ? '0 0 12px #00ff9c66' : 'none',
        pick: () => this.setState({ picked: t.id }) };
    });
    const reviews = { dip: 'Review.dc.html', comeback: 'ReviewComeback.dc.html', drop: 'ReviewDrop.dc.html', trend: 'ReviewTrend.dc.html', ai: 'ReviewAI.dc.html' };
    return { templates, reviewHref: reviews[picked] };
  }
}
</script>
</body>
</html>
