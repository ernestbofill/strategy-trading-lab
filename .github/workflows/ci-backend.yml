name: CI backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A throwaway PostgreSQL and S3-compatible store (RustFS), so the [NeonFact] tests run here too, against the
    # same migrations as production. No secrets: both live only for this job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stl
          POSTGRES_PASSWORD: stl
          POSTGRES_DB: stl_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stl -d stl_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      storage:
        image: rustfs/rustfs:1.0.3
        env:
          RUSTFS_ACCESS_KEY: stl-ci
          RUSTFS_SECRET_KEY: stl-ci-secret
        ports: ['9000:9000']
    env:
      ConnectionStrings__Default: Host=localhost;Database=stl_test;Username=stl;Password=stl
      DATABASE_URL: postgresql://stl:stl@localhost:5432/stl_test?sslmode=disable
      AWS_ENDPOINT_URL_S3: http://localhost:9000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: stl-ci
      AWS_SECRET_ACCESS_KEY: stl-ci-secret
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Against main as it is now, not as it was when the PR opened. The deploy workflow checks again
      # (two open PRs can both pass with the same bump).
      - name: Check the version was bumped
        working-directory: .
        run: |
          git fetch --quiet --no-tags --depth=1 origin main
          if git diff --quiet FETCH_HEAD HEAD -- backend ':(exclude,glob)backend/**/*.md' ':(exclude)backend/tests'; then
            echo "No backend code changed."
            exit 0
          fi
          version() { dotnet msbuild "$1" -getProperty:Version; }
          old=$(git show FETCH_HEAD:backend/Directory.Build.props > "$RUNNER_TEMP/main.props" 2>/dev/null && version "$RUNNER_TEMP/main.props" || true)
          new=$(version backend/Directory.Build.props)
          # sort -V orders 0.9.0-alpha < 0.10.0-alpha (but would put 1.0.0 before 1.0.0-alpha: revisit when leaving alpha).
          if [ "$old" = "$new" ] || [ "$(printf '%s\n' "$old" "$new" | sort -V | tail -n 1)" != "$new" ]; then
            echo "::error file=backend/Directory.Build.props::The backend changed: bump <Version> above main's $old (it's $new)."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/backend-v$new" > /dev/null; then
            echo "::error file=backend/Directory.Build.props::backend-v$new is already deployed: pick a new version."
            exit 1
          fi
          echo "Backend version: ${old:-none} -> $new"

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      # The schema from migrations.sql, as the deploy applies it, and the bucket neon.ts declares.
      - name: Prepare the test database and bucket
        run: |
          psql "postgresql://stl:stl@localhost:5432/stl_test" -v ON_ERROR_STOP=1 -q -f migrations.sql
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:9000 && break; sleep 2; done
          aws --endpoint-url "$AWS_ENDPOINT_URL_S3" s3 mb s3://assets
      # Every test runs, the [NeonFact] ones included, against the services above. ModelTests also fails on a model
      # change without a migration.
      - run: dotnet test --no-build --configuration Release
