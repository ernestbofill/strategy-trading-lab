# Copy of /etc/nginx/sites-enabled/strategy-trading-lab on the Oracle server (certbot manages the TLS lines).
# Not applied by the deploy workflow. To change the server: edit this file, then on the server
#   sudo cp <file> /etc/nginx/sites-enabled/strategy-trading-lab && sudo nginx -t && sudo systemctl reload nginx

server {
    server_name 140-238-209-178.sslip.io 140.238.209.178;
    root /var/www/strategy-trading-lab;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # add_header in a location block replaces these, so the two locations below repeat them.

    # Hashed build assets never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }
    # Service worker, manifest and HTML must always be revalidated
    location ~* (sw\.js|workbox-.*\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }
    # The API (systemd unit strategy-trading-lab-api, see deploy/backend): /api/health reaches /health
    location /api/ {
        proxy_pass http://127.0.0.1:5080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    # Client-side routes fall back to the app shell
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/140-238-209-178.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/140-238-209-178.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = 140-238-209-178.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name 140-238-209-178.sslip.io 140.238.209.178;
    return 404; # managed by Certbot


}