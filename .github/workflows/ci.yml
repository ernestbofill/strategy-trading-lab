name: CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Typechecks (tsc -b) and builds.
      - run: npm run build

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Check the version was bumped
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --quiet --no-tags --depth=1 origin "$BASE"
          if git diff --quiet "$BASE" HEAD -- backend ':(exclude,glob)backend/**/*.md'; then
            echo "No backend code changed."
            exit 0
          fi
          version() { grep -oP '(?<=<Version>)[^<]+' || true; }
          old=$(git show "$BASE:backend/Directory.Build.props" 2>/dev/null | version)
          new=$(version < backend/Directory.Build.props)
          if [ "$old" = "$new" ]; then
            echo "::error file=backend/Directory.Build.props::The backend changed: bump <Version> (still $new)."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/backend-v$new" > /dev/null; then
            echo "::error file=backend/Directory.Build.props::backend-v$new is already deployed: pick a new version."
            exit 1
          fi
          echo "Backend version: ${old:-none} -> $new"

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      # Fails when an entity or convention changed without a migration.
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project src/StrategyTradingLab.Api --no-build --configuration Release
      # Tests against a Neon branch skip here: CI has no Neon variables.
      - run: dotnet test --no-build --configuration Release
