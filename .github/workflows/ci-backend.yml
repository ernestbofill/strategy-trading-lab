name: CI backend

on:
  pull_request:

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A throwaway PostgreSQL and S3-compatible store (RustFS), so the [NeonFact] tests run here too, against the
    # same migrations as production. No secrets: both live only for this job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stl
          POSTGRES_PASSWORD: stl
          POSTGRES_DB: stl_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stl -d stl_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      storage:
        image: rustfs/rustfs:1.0.3
        env:
          RUSTFS_ACCESS_KEY: stl-ci
          RUSTFS_SECRET_KEY: stl-ci-secret
        ports: ['9000:9000']
    env:
      ConnectionStrings__Default: Host=localhost;Database=stl_test;Username=stl;Password=stl
      DATABASE_URL: postgresql://stl:stl@localhost:5432/stl_test?sslmode=disable
      AWS_ENDPOINT_URL_S3: http://localhost:9000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: stl-ci
      AWS_SECRET_ACCESS_KEY: stl-ci-secret
    steps:
      # The PR's merge commit and its first parent, main: enough to see what the PR changes.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # Every PR runs this workflow, so `backend` always reports to the required checks on main; the steps below run
      # only when the PR changes backend/ or this workflow. (A workflow-level paths filter would leave the check
      # waiting forever on PRs that don't touch it.)
      - name: Did backend change?
        id: changed
        working-directory: .
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(backend/|\.github/workflows/ci-backend.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing in backend/ changed: the checks are skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - if: steps.changed.outputs.run == 'true'
        run: dotnet restore
      # It exits 0 even when it finds something, so the step fails on its report instead.
      - if: steps.changed.outputs.run == 'true'
        name: Audit packages
        run: |
          dotnet list package --vulnerable --include-transitive | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then exit 1; fi
      - if: steps.changed.outputs.run == 'true'
        run: dotnet build --no-restore --configuration Release
      # The schema from migrations.sql, as the deploy applies it, and the bucket neon.ts declares.
      - if: steps.changed.outputs.run == 'true'
        name: Prepare the test database and bucket
        run: |
          psql "postgresql://stl:stl@localhost:5432/stl_test" -v ON_ERROR_STOP=1 -q -f migrations.sql
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:9000 && break; sleep 2; done
          aws --endpoint-url "$AWS_ENDPOINT_URL_S3" s3 mb s3://assets
      # Every test runs, the [NeonFact] ones included, against the services above. ModelTests also fails on a model
      # change without a migration.
      - if: steps.changed.outputs.run == 'true'
        run: dotnet test --no-build --configuration Release
