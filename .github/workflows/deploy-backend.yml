name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '!backend/**/*.md'
      - '!backend/tests/**'
      - 'deploy/backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  # Pushes the backend-v<version> tag.
  contents: write

jobs:
  deploy:
    # Only main: its commit count is the version, and a branch's would claim a number a later merge gets. A branch
    # goes out through the VS Code task, which doesn't tag.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # The whole history: deploy.ps1 makes the version from the number of commits.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # The same strategy-lab host the VS Code task uses.
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo '140.238.209.178 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMumRdCTFBX8D+D6UXcv9it9BiV+KX/DksM/7vYVa2xI' > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host strategy-lab
            HostName 140.238.209.178
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF

      - name: Build and install on the server
        id: deploy
        shell: pwsh
        run: ./deploy/backend/deploy.ps1

      # A re-run deploys the same commit, so the same version. The tag on another commit means main's history was
      # rewritten or merged without squashing: the version is no longer unique, so the run fails to show it.
      - name: Tag the version
        env:
          TAG: backend-v${{ steps.deploy.outputs.version }}
        run: |
          tagged=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [ -z "$tagged" ]; then
            git tag "$TAG" && git push origin "$TAG"
          elif [ "$tagged" = "$GITHUB_SHA" ]; then
            echo "$TAG already exists (a re-run)."
          else
            echo "::error::Deployed, but $TAG is already on $tagged: the version isn't unique. Check main's history."
            exit 1
          fi
