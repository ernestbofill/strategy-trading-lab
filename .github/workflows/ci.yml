name: CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Typechecks (tsc -b) and builds.
      - run: npm run build

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Against main as it is now, not as it was when the PR opened. The deploy workflow checks again
      # (two open PRs can both pass with the same bump).
      - name: Check the version was bumped
        working-directory: .
        run: |
          git fetch --quiet --no-tags --depth=1 origin main
          if git diff --quiet FETCH_HEAD HEAD -- backend ':(exclude,glob)backend/**/*.md' ':(exclude)backend/tests'; then
            echo "No backend code changed."
            exit 0
          fi
          version() { dotnet msbuild "$1" -getProperty:Version; }
          old=$(git show FETCH_HEAD:backend/Directory.Build.props > "$RUNNER_TEMP/main.props" 2>/dev/null && version "$RUNNER_TEMP/main.props" || true)
          new=$(version backend/Directory.Build.props)
          # sort -V orders 0.1.0-alpha.9 < 0.1.0-alpha.10 (but would put 0.1.0 before its alphas).
          if [ "$old" = "$new" ] || [ "$(printf '%s\n' "$old" "$new" | sort -V | tail -n 1)" != "$new" ]; then
            echo "::error file=backend/Directory.Build.props::The backend changed: bump <Version> above main's $old (it's $new)."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/backend-v$new" > /dev/null; then
            echo "::error file=backend/Directory.Build.props::backend-v$new is already deployed: pick a new version."
            exit 1
          fi
          echo "Backend version: ${old:-none} -> $new"

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      # Fails when an entity or convention changed without a migration.
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project src/StrategyTradingLab.Api --no-build --configuration Release
      # Tests against a Neon branch skip here: CI has no Neon variables.
      - run: dotnet test --no-build --configuration Release
