name: CI frontend

on:
  pull_request:

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # The PR's merge commit and its first parent, main: enough to see what the PR changes.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # Every PR runs this workflow, so `frontend` always reports to the required checks on main; the steps below run
      # only when the PR changes frontend/ or this workflow. (A workflow-level paths filter would leave the check
      # waiting forever on PRs that don't touch it.)
      - name: Did frontend change?
        id: changed
        working-directory: .
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(frontend/|\.github/workflows/ci-frontend.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing in frontend/ changed: the checks are skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # As the backend's: against main as it is now, so two PRs can't both ship the same version (#142 and #140 did).
      - if: steps.changed.outputs.run == 'true'
        name: Check the version was bumped
        working-directory: .
        run: |
          git fetch --quiet --no-tags --depth=1 origin main
          if git diff --quiet FETCH_HEAD HEAD -- frontend ':(exclude,glob)frontend/**/*.md' ':(exclude,glob)frontend/**/*.test.ts' ':(exclude,glob)frontend/**/*.test.tsx'; then
            echo "No frontend code changed."
            exit 0
          fi
          version() { node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version'; }
          old=$(git show FETCH_HEAD:frontend/package.json 2>/dev/null | version || true)
          new=$(version < frontend/package.json)
          # sort -V orders 0.9.0-alpha < 0.10.0-alpha (but would put 1.0.0 before 1.0.0-alpha: revisit when leaving alpha).
          if [ "$old" = "$new" ] || [ "$(printf '%s\n' "$old" "$new" | sort -V | tail -n 1)" != "$new" ]; then
            echo "::error file=frontend/package.json::The frontend changed: bump its version above main's $old (it's $new), in package.json and package-lock.json."
            exit 1
          fi
          echo "Frontend version: ${old:-none} -> $new"

      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - if: steps.changed.outputs.run == 'true'
        run: npm ci
      - if: steps.changed.outputs.run == 'true'
        run: npm run lint
      - if: steps.changed.outputs.run == 'true'
        run: npm test
      # Typechecks (tsc -b) and builds.
      - if: steps.changed.outputs.run == 'true'
        run: npm run build
